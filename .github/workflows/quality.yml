name: Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, type-check, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        # P1.5 tracks the existing repository-wide lint debt. Keep it visible
        # in every PR without blocking verified checks until that debt is retired.
        continue-on-error: true

      - name: Run tests
        run: bun run test

      - name: Type-check
        run: bun x tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Verify generated-file and diff integrity
        run: |
          git restore --source=HEAD -- src/routeTree.gen.ts
          git diff --check
          git diff --exit-code
